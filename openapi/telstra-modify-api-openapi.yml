components:
  schemas:
    ModifyBandwidthRequest:
      type: object
      required:
      - newBandwidth
      properties:
        newBandwidth:
          type: string
          description: Requested new bandwidth value for the service. Allowed values [250 Mbps, 500 Mbps, 1 Gbps, 2 Gbps].
          example: 500 Mbps
          minLength: 4
          maxLength: 16
          enum:
          - 250 Mbps
          - 500 Mbps
          - 1 Gbps
          - 2 Gbps
    Errors:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          minItems: 0
          maxItems: 10
    ModifyBandwidthResponse:
      type: object
      required:
      - requestId
      - serviceId
      - status
      - submittedAt
      - submittedBy
      - pollAfter
      - errors
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          example: e7b8c2a0-4f3b-4e2a-9c1a-2b7e8d9f6a1b
        serviceId:
          type: string
          minLength: 16
          maxLength: 16
          example: AAZZ000000123456
        status:
          type: string
          minLength: 1
          maxLength: 32
          example: accepted
        submittedAt:
          type: string
          minLength: 1
          maxLength: 32
          example: '2025-10-27T10:00:00Z'
        submittedBy:
          type: string
          minLength: 1
          maxLength: 128
          example: abc@xyz.com
        pollAfter:
          type: string
          description: Indicator for recommended next polling interval duration ISO 8601 duration format "PT5M" → 5 minutes "PT2H" → 2 hours "P1D" → 1 day "P2W" → 2 weeks
          minLength: 1
          maxLength: 10
          example: 30S
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          minItems: 0
          maxItems: 10
    AFModifyBandwidthRequest:
      type: object
      required:
      - newBandwidth
      properties:
        newBandwidth:
          type: string
          description: Requested new bandwidth value for the service. Allowed values [ 250 Mbps, 300Mbps, 400 Mbps, 500 Mbps, 600Mbps, 800Mbps, 1 Gbps, 2 Gbps, 4Gbps].For Telstra Fibre additional 6Gbps, 8Gbps and 10 Gbps is also supported.
          example: 500 Mbps
          minLength: 4
          maxLength: 16
          enum:
          - 250 Mbps
          - 300 Mbps
          - 400 Mbps
          - 500 Mbps
          - 600 Mbps
          - 800 Mbps
          - 1 Gbps
          - 2 Gbps
          - 4 Gbps
    ModifyPlanABRequest:
      type: object
      required:
      - newPlan
      properties:
        newPlan:
          type: string
          description: Requested new plan value for the service. Allowed values [50/20 Mbps,100/20 Mbps,100/40 Mbps,250/100 Mbps,500/200 Mbps,1000/400 Mbps
          example: 50/100 Mbps
          minLength: 4
          maxLength: 16
    Error:
      type: object
      required:
      - code
      - issue
      - suggested_action
      - field
      - value
      - location
      - link
      properties:
        code:
          type: string
          description: Machine-readable error code.
          minLength: 1
          maxLength: 32
        issue:
          type: string
          description: Human-readable explanation of the error.
          minLength: 1
          maxLength: 256
          example: Requested newBandwidth exceeds supported Adaptive Fibre capacity
        suggested_action:
          type: string
          description: Recommended corrective action.
          minLength: 1
          maxLength: 256
          example: Due to physical change required, proceed to Adaptive Network Centre to raise request
        field:
          type: string
          description: Name of the field causing the error (if applicable).
          minLength: 0
          maxLength: 64
          example: type
        value:
          type: string
          description: The invalid value provided (if applicable).
          minLength: 0
          maxLength: 128
          example: abc
        location:
          type: string
          description: Where the error occurred.
          enum:
          - query
          - header
          - path
          - body
          - method
          - server
          - decision
          minLength: 0
          maxLength: 8
          example: query
        link:
          type: string
          description: Reference URL for more information about this error code.
          minLength: 0
          maxLength: 256
          example: https://api.example.com/docs/errors#NEW_BW_GT_AF_SUPPORT
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: OAuth2 client-credentials flow (Cat-1).
      flows:
        clientCredentials:
          tokenUrl: https://prod.okapi.ogw.evolve.okapi.telstra.com/og-network-auth-prod/api/realms/network-auth/protocol/openid-connect/token
          scopes:
            fixed-connectivity:modify-bandwidth:modify: combined scope for all the end points in package
