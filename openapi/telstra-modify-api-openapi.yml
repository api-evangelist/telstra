paths:
  /internet-direct/services/{serviceId}/bandwidth/modify:
    post:
      tags:
      - Modify
      operationId: modifyBandwidth
      summary: Modify bandwidth for an active Internet Direct service
      description: Submits a request to modify the bandwidth of an active Internet Direct service. Requires valid `serviceId`, and `newBandwidth`. Enforces authority, service validation, and business rules. Returns transaction metadata and error envelope for all outcomes, including business rule rejections and technical failures.
      security:
      - OAuth2ClientCredentials:
        - fixed-connectivity:modify-bandwidth:modify
      parameters:
      - name: Authorization
        in: header
        required: true
        description: OAuth2 token for authentication.
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: IYpGOTXFWA1hG7MoBkZnmDmvY7ZQ
      - name: X-Correlation-Id
        in: header
        required: true
        description: Unique Correlation Id for each transaction to be used by all consumers.
        schema:
          type: string
          minLength: 36
          maxLength: 36
        example: f7c94213-36df-44cc-935f-025bb52cad42
      - name: Content-Type
        in: header
        required: true
        description: Accepting with application/json.
        schema:
          type: string
          enum:
          - application/json
        example: application/json
      - name: Accept
        in: header
        required: true
        description: Accept type of response (application/json).
        schema:
          type: string
          enum:
          - application/json
        example: application/json
      - name: Accept-Charset
        in: header
        required: true
        description: Specifies the character sets that are acceptable for response. Default is UTF-8 if not specified.
        schema:
          type: string
          enum:
          - UTF-8
          - ISO-8859-1
          - US-ASCII
          minLength: 5
          maxLength: 10
        example: UTF-8
      - name: Content-Language
        in: header
        required: true
        description: Language of the request content (e.g., en, en-US).
        schema:
          type: string
          minLength: 2
          maxLength: 8
        example: en-AU
      - name: Telstra-api-version
        in: header
        required: false
        description: B2B2X Header-based API version. Specify the published API minor version (e.g., 1.2).
        schema:
          type: string
          minLength: 1
          maxLength: 16
        example: '1.2'
      - name: serviceId
        in: path
        required: true
        description: Customer-facing service identifier for Internet Direct.
        schema:
          type: string
          minLength: 16
          maxLength: 16
        example: AAZZ000000123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyBandwidthRequest'
      responses:
        '202':
          description: Bandwidth modification request accepted for asynchronous processing
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyBandwidthResponse'
              examples:
                accepted:
                  summary: Request accepted for async processing
                  value:
                    requestId: e7b8c2a0-4f3b-4e2a-9c1a-2b7e8d9f6a1b
                    serviceId: AAZZ000000123456
                    cidn: '7896618019'
                    status: accepted
                    submittedAt: '2025-10-27T10:00:00Z'
                    submittedBy: abc@xyz.com
                    pollAfter: 30S
                    errors: []
        '400':
          description: Bad Request — invalid or incomplete input specific to modify‑bandwidth
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                missingNewBandwidth:
                  summary: Missing required newBandwidth field
                  value:
                    errors:
                    - code: FIELD_MISSING
                      issue: The 'newBandwidth' is missing.
                      suggested_action: Please provide all required fields.
                      field: newBandwidth
                      value: ''
                      location: body
                      link: https://api.example.com/docs/errors#FIELD_MISSING
                invalidBandwidth:
                  summary: Invalid bandwidth value
                  value:
                    errors:
                    - code: FIELD_INVALID
                      issue: The newBandwidth is invalid.
                      suggested_action: Check the newBandwidth. It should be one of [250 Mbps,300 Mbps,400 Mbps, 500 Mbps,800 Mbps,1 Gbps,2 Gbps,4 Gbps,6 Gbps,8 Gbps,10 Gbps].
                      field: newBandwidth
                      value: 100 Mbps
                      location: body
                      link: https://api.example.com/docs/errors#FIELD_INVALID
        '401':
          description: Unauthorized — missing or invalid token
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                invalidToken:
                  summary: Invalid authentication token
                  value:
                    errors:
                    - code: INVALID_TOKEN
                      issue: The Authentication Token is Missing or Invalid.
                      suggested_action: Check the Authentication Token. It should be the same you received in the Generate Authentication Token response.
                      field: Authorization
                      value: ''
                      location: header
                      link: https://api.example.com/docs/errors#INVALID_TOKEN
        '403':
          description: Forbidden — caller not permitted to modify bandwidth
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                forbidden:
                  summary: Caller not permitted
                  value:
                    errors:
                    - code: RESOURCE_AUTH_ERR
                      issue: You don't have permission to access this resource.
                      suggested_action: Check the permissions associated with your account.
                      location: decision
                      link: https://api.example.com/docs/errors#RESOURCE_AUTH_ERR
        '404':
          description: Not Found — service not found for modify‑bandwidth
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                notFound:
                  summary: Service or CIDN not found
                  value:
                    errors:
                    - code: NOT_FOUND
                      issue: Service or CIDN relationship not found.
                      suggested_action: Verify serviceId and cidn values.
                      location: body
                      link: https://api.example.com/docs/errors#NOT_FOUND
        '429':
          description: Too Many Requests — rate limit exceeded
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
            Retry-After:
              description: Seconds until the client may retry.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                rateLimit:
                  summary: Rate limit exceeded
                  value:
                    errors:
                    - code: TOO_MANY_REQUESTS
                      issue: The API rate limit has been reached.
                      suggested_action: Reduce the number of concurrent calls and try again.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.example.com/docs/errors#TOO_MANY_REQUESTS
        '500':
          description: Internal Server Error — unexpected server-side error occurred
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                serverError:
                  summary: Unexpected server error
                  value:
                    errors:
                    - code: INTERNAL_SERVER_ERROR
                      issue: An unexpected error occurred.
                      suggested_action: Please try again later. If the issue persists, Contact Telstra support with your correlationId.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.example.com/docs/errors#INTERNAL_SERVER_ERROR
                technicalFailure:
                  summary: Non-recoverable technical error
                  value:
                    errors:
                    - code: TECHNICAL_FAILURE
                      issue: An unexpected error occurred.
                      suggested_action: Please try again later. If the issue persists, Contact Telstra support with your correlationId.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.example.com/docs/errors#TECHNICAL_FAILURE
        '503':
          description: Service Unavailable — temporary maintenance or overload
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
            Retry-After:
              description: Seconds until the client may retry.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                serviceUnavailable:
                  summary: Service temporarily unavailable
                  value:
                    errors:
                    - code: SERVICE_UNAVAILABLE
                      issue: Service temporarily unavailable (maintenance/overload).
                      suggested_action: Retry after a short delay or check the status page for outage updates.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.example.com/docs/errors#SERVICE_UNAVAILABLE
