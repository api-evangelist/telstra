          maximum: 1440
          description: How many minutes you asked the server to keep trying to send the message.
        scheduleSend:
          type: string
          minLength: 10
          maxLength: 24
          format: date-time
          description: The time the message is scheduled to send.
        deliveryNotification:
          type: boolean
