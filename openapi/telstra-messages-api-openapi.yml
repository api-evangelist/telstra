components:
  requestBodies:
    messageTags:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - tags
            properties:
              tags:
                type: array
                maxItems: 10
                minItems: 0
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
                example:
                - marketing
                - SMS
                description: 'Write the updated list of tag(s) here. You can assign up to 10 tags per message.


                  Note that if you provide an empty array, any pre-existing tags will be wiped.

                  '
    messagePost:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - to
            - from
            properties:
              to:
                description: "This is the mobile number you want to send your message to. Write Australian numbers in national format (e.g. 0412345678) and international numbers (paid plans only) in E.164 format (e.g. +441234567890). \n\nUse a string for a single recipient, and an array of string of multiple recipients, e.g. \"to\": [\"0412345678\", \"+441234567890\"]. If you're using the Free Trial, you can include up to 5 recipient numbers in the array. If you're using a paid plan, you can bulk send up to 500 messages at once.\n"
                oneOf:
                - type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                    minLength: 5
                    maxLength: 16
                - type: string
                  minLength: 5
                  maxLength: 16
              from:
                description: "When the recipient receives your message, you can choose whether they'll see a virtualNumber or senderName (paid plans only) in the **from** field.  \n\n* 04xxxxxxxx: Use one of the Virtual Numbers associated with your account. You'll also be able to receive SMS replies to this number. \n* senderName: Choose a unique alphanumeric string of up to 11 characters (paid feature).\n"
                type: string
                minLength: 1
                maxLength: 13
              messageContent:
                type: string
                minLength: 1
                maxLength: 1600
                description: "Use this field to send an SMS. Your text message goes here.   \n\nNote: either messageContent or multimedia are required, or you can use both field if you want to send multimedia with text.\n"
              multimedia:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  $ref: '#/components/schemas/Multimedia'
                description: "Use this field to send an MMS. Add your image, video or audio content here. \n\nNote: either messageContent or multimedia are required, or you can use both field if you want to send multimedia with text.\n\nInclude a JSON payload with:\n\ntype: the type of multimedia content file you're sending (image, audio, video or pdf) followed by the file type. Use the format \"multimedia type/file type\", e.g. \"image/PNG\", \"audio/MP3\", \"application/pdf\". Supported file types: JPEG, BMP, GIF87a, GIF89a, PNG, MP3, WAV, MPEG, MPG, MP4, 3GP, US-ASCII, VCARD and PDF.\n\nfileName: the name of your multimedia file.\n\npayload: the base64 encoded content. You can use [this online tool](https://elmah.io/tools/base64-image-encoder/) to encode an image, or [Base64 Guru](https://base64.guru/) to encode a video or audio file.\n"
              retryTimeout:
                type: integer
                format: int32
                default: 10
                minimum: 10
                maximum: 1440
                description: 'If the message is queued or unable to reach the recipient''s device, tell us how many minutes the network should keep trying. Use an integer between 10 and 1440. If you don''t set a value, we''ll retry for 10 minutes.

                  '
              scheduleSend:
                type: string
                minLength: 10
                maxLength: 24
                format: date-time
                description: 'Don''t want to send the message right away? Tell us what time you want to add it to the queue for sending instead.


                  Set the time in London Greenwich Mean Time (adjusting for any time difference) and use ISO format, e.g. "2019-08-24T15:39:00Z".


                  You can schedule a message up to 10 days into the future. If you specify a timestamp outside of this limit, the API will return a FIELD_INVALID error.

                  '
              deliveryNotification:
                type: boolean
                default: false
                description: 'To receive a notification when your SMS has been delivered, set this parameter to **true** and make sure you provide a **statusCallbackUrl** (paid feature).

                  '
              statusCallbackUrl:
                type: string
                example: http://www.example.com
                description: "Tell us the URL you want the API to call when the status of your SMS updates. \n\nTo receive a status update, this field must be provided and deliveryNotification must be set to **true**. \n\nThe status will be either:  \n* **queued** - the message is in the queue for sending (default).\n* **sent** - your message has been sent from the server.\n* **expired** - we weren't able to send the message within the **retryTimeout** timeframe.\n* **delivered** - the message has successfully reached the recipient's device. Note that we will only be able to return this status if you set **deliveryNotification** to **true** (paid feature).\n* **undeliverable** - the delivery of your message failed (paid feature).\n\nSample callback response:\n\n<pre><code class=\"language-sh\">{\n  \"to\":\"0476543210\", \n  \"from\":\"0401234567\",  \n  \"timestamp\":\"2022-11-10T05:06:42.823Z\", \n  \"messageId\":\"1520b774-46b0-4415-a05f-7bcb1c032c59\", \n  \"status\":\"delivered\" \n}</code></pre>\n"
              tags:
                type: array
                maxItems: 10
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
                description: 'Create your own tags and use them to fetch and sort your messages through our other endpoints. You can assign up to 10 tags per message.

                  '
    messagePut:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - to
            - from
            properties:
              to:
                description: 'This is the mobile number you want to send your message to. Write Australian numbers in national format (e.g. 0412345678) and international numbers (paid plans only) in E.164 format (e.g. +441234567890).


                  Use a string for a single recipient, and an array of strings for multiple recipients, e.g. "to": ["0412345678", "+441234567890"]. If you''re using the Free Trial, you can include up to 5 recipient numbers in the array. If you''re using a paid plan, you can bulk send up to 500 messages at once.

                  '
                type: string
