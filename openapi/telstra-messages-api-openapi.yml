        fileName:
          type: string
          minLength: 1
          maxLength: 100
          example: image/jpeg
          description: The name of the multimedia file.
        payload:
          type: string
          minLength: 1
          maxLength: 999999
          example: iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHxgljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg==
          description: 'The base64 encoded content. You can use [this online tool](https://elmah.io/tools/base64-image-encoder/) to encode an image, or [Base64 Guru](https://base64.guru/) to encode a video or audio file.

            '
    MessageGet:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: Use this UUID with our other endpoints to fetch, update or delete the message.
        status:
          type: string
          description: The status will be either queued, sent, delivered, expired or undeliverable.
          enum:
          - queued
          - sent
          - delivered
          - expired
          - undeliverable
        createTimestamp:
          type: string
          format: date-time
          description: The time you submitted the message to the queue for sending.
        sentTimestamp:
          type: string
          format: date-time
          description: The time the message was sent from the server.
        receivedTimestamp:
          type: string
          format: date-time
          description: The time the message was received by the recipient's device.
        to:
          description: The recipient's mobile number.
          type: string
          minLength: 5
          maxLength: 16
        from:
          type: string
          minLength: 1
          maxLength: 13
          description: This will be one of your Virtual Numbers or your senderName.
        messageContent:
          type: string
          minLength: 1
          maxLength: 1600
          description: 'The content of the message.



            For received multipart messages, each segment will be prefixed with `p<segment-number>/<total-segments>:`. For example, if the message has 2 segments, the first message segment will start with `p1/2:`, the second message segment will start with `p2/2:`

            '
        multimedia:
          type: array
          minItems: 1
          maxItems: 5
          description: 'The multimedia content of the message (MMS only). It will include:

            '
          items:
            $ref: '#/components/schemas/MultimediaGet'
        direction:
          type: string
          description: '* **outgoing** - messages sent from your account.

            * **incoming** - messages sent to your account.

            '
          enum:
          - outgoing
          - incoming
        retryTimeout:
          type: integer
          format: int32
          default: 50
