                maxLength: 16
              from:
                description: 'When the recipient receives your message, you can choose whether they''ll see a virtualNumber or senderName (paid plans only) in the **from** field.


                  * 04xxxxxxxx: Use one of the Virtual Numbers associated with your account. You''ll also be able to receive SMS replies to this number.

                  * senderName: Choose a unique alphanumeric string of up to 11 characters (paid feature).

                  '
                type: string
                minLength: 1
                maxLength: 13
              messageContent:
                type: string
                minLength: 1
                maxLength: 1600
                description: "Use this field to send an SMS. Your text message goes here. \n\nNote: either messageContent or multimedia are required, or you can use both field if you want to send multimedia with text.\n"
              multimedia:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  $ref: '#/components/schemas/Multimedia'
                description: "Use this field to send an MMS. Add your image, video or audio content here. \n\nNote: either messageContent or multimedia are required, or you can use both fields if you want to send multimedia with text. \n\nInclude a JSON payload with:\n\ntype: the type of multimedia content file you're sending (image, audio, video or pdf) followed by the file type. Use the format 'multimedia type/file type', e.g. \"image/PNG\", \"audio/MP3\", \"application/pdf\". Supported file types: JPEG, BMP, GIF87a, GIF89a, PNG, MP3, WAV, MPEG, MPG, MP4, 3GP, US-ASCII, VCARD and PDF.\n\nfileName: the name of your multimedia file. \n\npayload: the base64 encoded content. You can use [this online tool](https://elmah.io/tools/base64-image-encoder/) to encode an image, or [Base64 Guru](https://base64.guru/) to encode a video or audio file.\n"
              retryTimeout:
                type: integer
                format: int32
                default: 10
                minimum: 10
                maximum: 1440
                description: 'If the message is queued or unable to reach the recipient''s device, tell us how many minutes the network should keep trying. Use an integer between 10and 1440. If you don''t set a value, we''ll retry for 10 minutes.

                  '
              scheduleSend:
                type: string
                minLength: 10
                maxLength: 24
                format: date-time
                description: 'Don''t want to send the message right away? Tell us what time you want to add it to the queue for sending instead.


                  Set the time in London Greenwich Mean Time (adjusting for any time difference) and use ISO format, e.g. "2019-08-24T15:39:00Z".


                  You can schedule a message up to 10 days into the future. If you specify a timestamp outside of this limit, the API will return a FIELD_INVALID error.

                  '
              deliveryNotification:
                type: boolean
                default: false
                description: 'To receive a notification when your SMS has been delivered, set this parameter to **true** and make sure you provide a **statusCallbackUrl** (paid feature).

                  '
              statusCallbackUrl:
                type: string
                example: http://www.example.com
                description: "Tell us the URL you want the API to call when the status of your SMS updates. \n\nTo receive a status update, this field must be provided and deliveryNotification must be set to **true**. \n\nThe status will be either:  \n* **queued** - the message is in the queue for sending (default).\n* **sent** - your message has been sent from the server.\n* **expired** - we weren't able to send the message within the **retryTimeout** timeframe.\n* **delivered** - the message has successfully reached the recipient's device. Note that we will only be able to return this status if you set **deliveryNotification** to **true** (paid feature).\n* **undeliverable** - the delivery of your message failed (paid feature).\n\nSample callback response:\n\n<pre><code class=\"language-sh\">{\n  \"to\":\"0476543210\", \n  \"from\":\"0401234567\", \n  \"timestamp\":\"2022-11-10T05:06:42.823Z\", \n  \"messageId\":\"1520b774-46b0-4415-a05f-7bcb1c032c59\", \n  \"status\":\"delivered\" \n}</code></pre>\n"
              tags:
                type: array
                maxItems: 10
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
                description: 'Create your own tags and use them to fetch and sort your messages through our other endpoints. You can assign up to 10 tags per message.

                  '
  schemas:
    Errors:
      type: object
      properties:
        errors:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Error'
    MessageUpdate:
      type: object
      properties:
        messageId:
          type: string
          minLength: 36
          maxLength: 36
          format: uuid
          description: Use this UUID with our other endpoints to fetch, update or delete the message.
        status:
          type: string
          description: The status will be either queued, sent, delivered, expired or undeliverable.
          enum:
          - queued
          - sent
          - delivered
          - expired
          - undeliverable
        to:
          description: The recipient's mobile number.
          type: string
          minLength: 5
          maxLength: 16
        from:
          type: string
          minLength: 1
          maxLength: 13
          description: This will be one of your Virtual Numbers or your senderName.
        messageContent:
          type: string
          minLength: 1
          maxLength: 1600
          description: The content of the message.
        multimedia:
          type: array
          minItems: 1
          maxItems: 5
          description: 'The multimedia content of the message (MMS only). It will include:

            '
          items:
            $ref: '#/components/schemas/MultimediaGet'
        retryTimeout:
          type: integer
          minimum: 10
          maximum: 1440
          description: How many minutes you asked the server to keep trying to send the message.
        scheduleSend:
          type: string
          minLength: 10
          maxLength: 24
          format: date-time
          description: The time the message is scheduled to send.
        deliveryNotification:
          type: boolean
          default: false
          description: If set to **true**, you will receive a notification to the statusCallbackUrl when your message is delivered (paid feature).
        statusCallbackUrl:
          type: string
          description: The URL the API will call when the status of the message changes.
        queuePriority:
          type: integer
          format: int32
          default: 2
          minimum: 1
          maximum: 3
          example: 2
          description: The priority assigned to the message.
        tags:
          type: array
          minItems: 0
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Any customisable tags assigned to the message.
    Paging:
      type: object
      properties:
        nextPage:
          type: string
          description: The next page of results.
        previousPage:
          type: string
          description: The previous page of results.
        lastPage:
          type: string
          description: The last page of results.
        totalCount:
          type: number
          description: The total number of pages.
    Error:
      type: object
      required:
      - code
      - issue
      - suggested_action
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique code of the error
        issue:
          type: string
          minLength: 1
          maxLength: 99999
          description: The reason for the error
        suggested_action:
          type: string
          minLength: 1
          maxLength: 99999
          description: Suggest practical actions for this particular issue.
        field:
          type: string
          minLength: 1
          maxLength: 99999
          description: The field that caused the error
        value:
          type: string
          minLength: 1
          maxLength: 99999
          description: The value of the field that caused the error
        location:
          type: string
          description: The location of the field that caused the error.
          enum:
          - body
          - path
          - query
        link:
          type: string
          minLength: 1
          maxLength: 99999
          description: URI for detailed information related to this error for the developer.
    MultimediaGet:
      type: object
      required:
      - type
      - fileName
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 100
          example: image/jpeg
          description: The type of multimedia content (image, audio or video) followed by the type (e.g. jpeg, png, text).
        fileName:
          type: string
          minLength: 1
          maxLength: 100
          example: image.jpeg
          description: The name of the multimedia file.
