  parameters:
    ContentType:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        example: application/json
    messageEndTime:
      name: endTime
      in: query
      description: 'By Default messages from last 30 days will be fetched. Use this parameter to fetch the messages till the time you want.


        Set the time in London Greenwich Mean Time (adjusting for any time difference) and use ISO format, e.g. "2024-01-24T16:39:00Z".


        You can set a time from last 30 days and endTime should be after startTime (if set). If you specify a timestamp outside of this limit, the API will return a FIELD_INVALID error.

        '
      schema:
        type: string
        format: date-time
    messageIdGet:
      name: messageId
      in: path
      description: "When you sent the original message, this is the UUID that was returned in the response. Use this ID to fetch, update or delete a message with the appropriate endpoints. \n\nIncoming messages are also assigned a messageId. Use this ID with GET/ messages/{messageId} to fetch the message later.\n"
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        example: Bearer <access_token>
    messageId:
      name: messageId
      in: path
      description: 'When you sent the original message, this is the UUID that was returned in the call response. Use this ID to fetch, update or delete a message with the appropriate endpoints.

        '
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
    AcceptCharset:
      name: Accept-Charset
      in: header
      required: true
      schema:
        type: string
        example: utf-8
    messageDirection:
      name: direction
      in: query
      description: 'Filter your messages by direction:

        * **outgoing** - messages sent from your account.

        * **incoming** - messages sent to your account.

        '
      schema:
        type: string
        enum:
        - outgoing
        - incoming
    offset:
      name: offset
      description: 'Use the offset to navigate between the response results. An offset of 0 will display the first page of results, and so on.

        '
      in: query
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
        maximum: 999999
    TelstraAPIVersion:
      name: Telstra-api-version
      in: header
      required: false
      schema:
        type: string
        example: 3.1.0
    limit:
      name: limit
      in: query
      description: 'Tell us how many results you want us to return, up to a maximum of 50.

        '
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1
        maximum: 50
    messageFilter:
      name: filter
      in: query
      description: 'Filter your messages by:


        * tag - use one of the tags assigned to your message(s)

        * number - either the Virtual Number used to send the message, or the Recipient Number the message was sent to.

        '
      schema:
        type: string
    messageStatus:
      name: status
      in: query
      description: "Filter your messages by one of the statuses below:\n\n* **queued** - messages queued for sending or still in transit.\n* **sent** - messages that have been sent from the server.\n* **delivered** - messages successful delivered to the recipient's device. Note that we will only be able to return this status if you set deliveryNotification to **true** (paid feature). \n* **expired** - message that couldn't be sent within the **retryTimeout** timeframe.\n"
      schema:
        type: string
        enum:
        - queued
        - sent
        - delivered
        - expired
    ContentLanguage:
      name: Content-Language
      in: header
      required: true
      schema:
        type: string
        example: en-au
    messageReverse:
      name: reverse
      in: query
      description: 'If set to **true** the results will be returned in reverse order. Recent messages will be returned first. By default, the results will be returned in the order they were sent/received.

        '
      schema:
        type: boolean
        default: false
    messageStartTime:
      name: startTime
      in: query
      description: 'By Default messages from last 30 days will be fetched.Use this parameter to fetch the messages from the time you want.


        Set the time in London Greenwich Mean Time (adjusting for any time difference) and use ISO format, e.g. "2024-01-24T15:39:00Z".


        You can set a time from last 30 days. If you specify a timestamp outside of this limit, the API will return a FIELD_INVALID error. If startTime alone set, messages from this time till current time will be fetched.

        '
      schema:
        type: string
        format: date-time
    Accept:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        example: application/json
  securitySchemes:
    bearer_auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://products.api.telstra.com/v2/oauth/token
          scopes:
            free-trial-numbers:read: read information for free trial numbers
            free-trial-numbers:write: write information for free trial numbers
            messages:read: read information for messages
            messages:write: write information for messages
            reports:read: read information for reports
            reports:write: write information for reports
            virtual-numbers:read: read information for virtual-numbers
            virtual-numbers:write: write information for virtual numbers
