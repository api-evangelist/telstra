components:
  parameters:
    ContentLanguage:
      name: Content-Language
      in: header
      required: true
      schema:
        type: string
        example: en-au
    offset:
      name: offset
      description: 'Use the offset to navigate between the response results. An offset of 0 will display the first page of results, and so on.

        '
      in: query
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
        maximum: 999999
    virtual-number:
      name: virtual-number
      in: path
      description: 'Write the Virtual Number here, using national format (e.g. 0412345678).

        '
      required: true
      schema:
        type: string
        minLength: 10
        maxLength: 10
        example: 0412345678
    ContentType:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        example: application/json
    TelstraAPIVersion:
      name: Telstra-api-version
      in: header
      required: false
      schema:
        type: string
        example: 3.1.0
    AcceptCharset:
      name: Accept-Charset
      in: header
      required: true
      schema:
        type: string
        example: utf-8
    limit:
      name: limit
      in: query
      description: 'Tell us how many results you want us to return, up to a maximum of 50.

        '
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1
        maximum: 50
    Accept:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        example: application/json
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        example: Bearer <access_token>
    numberFilter:
      name: filter
      in: query
      description: Filter your Virtual Numbers by tag or by number.
      schema:
        type: string
  schemas:
    Recipient-optout:
      type: object
      properties:
        optoutNumber:
          type: string
          minLength: 5
          maxLength: 16
          description: The mobile number that sent the optout request.
        createTimestamp:
          type: string
          format: date-time
          description: The date and time we received the optout request.
    Errors:
      type: object
      properties:
        errors:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Error'
    Paging:
      type: object
      properties:
        nextPage:
          type: string
          description: The next page of results.
        previousPage:
          type: string
          description: The previous page of results.
        lastPage:
          type: string
          description: The last page of results.
        totalCount:
          type: number
          description: The total number of pages.
    Virtual-number:
      type: object
      properties:
        virtualNumber:
          type: string
          minLength: 10
          maxLength: 10
          example: 401234567
          description: 'The Virtual Number assigned to your account.

            '
        replyCallbackUrl:
          type: string
          example: http://www.example.com
          description: The URL that replies to the Virtual Number will be posted to.
        tags:
          description: 'Any customisable tags assigned to the Virtual Number.

            '
          type: array
          minItems: 0
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 64
        lastUse:
          description: The last time the Virtual Number was used to send a message.
          type: string
          format: date-time
    Error:
      type: object
      required:
      - code
      - issue
      - suggested_action
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique code of the error
        issue:
          type: string
          minLength: 1
          maxLength: 99999
          description: The reason for the error
        suggested_action:
          type: string
          minLength: 1
          maxLength: 99999
          description: Suggest practical actions for this particular issue.
        field:
          type: string
          minLength: 1
          maxLength: 99999
          description: The field that caused the error
        value:
          type: string
          minLength: 1
          maxLength: 99999
          description: The value of the field that caused the error
        location:
          type: string
          description: The location of the field that caused the error.
          enum:
          - body
          - path
          - query
        link:
          type: string
          minLength: 1
          maxLength: 99999
          description: URI for detailed information related to this error for the developer.
  requestBodies:
    numberPut:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              replyCallbackUrl:
                type: string
                example: http://www.example.com
                description: "Tell us the URL that replies to the Virtual Number should be sent to.\n\nNote that if you don't include this field, any pre-existing replyCallbackUrl will be wiped.\n\nSample callback response:\n\n<pre><code class=\"language-sh\">{\n  \"to\":\"0476543210\", \n  \"from\":\"0401234567\", \n  \"timestamp\":\"2022-11-10T05:06:42.823Z\",\n  \"messageId\":\"75f263c0-60b5-11ed-8456-71ae4c63550d\", \n  \"messageContent\":\"Hi, example message\", \n  \"multimedia\": { \n    \"fileName\":\"image.jpeg\", \n    \"type\":\"image/jpeg\", \n    \"payload\":\"base64 payload\" \n  }\n}</code></pre>\n"
              tags:
                description: "Create your own tags and use them to fetch, sort and report on your Virtual Numbers through our other endpoints. You can assign up to 10 tags per number. \n\nNote that if you don't include this field, any pre-existing tags will be wiped.\n"
                type: array
                maxItems: 10
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
    numberPost:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              replyCallbackUrl:
                type: string
                example: http://www.example.com
                description: "Tell us the URL that replies to the Virtual Number should be sent to.\n\nSample callback response:\n\n<pre><code class=\"language-sh\">{\n  \"to\":\"0476543210\", \n  \"from\":\"0401234567\", \n  \"timestamp\":\"2022-11-10T05:06:42.823Z\", \n  \"messageId\":\"75f263c0-60b5-11ed-8456-71ae4c63550d\", \n  \"messageContent\":\"Hi, example message\", \n  \"multimedia\": { \n    \"fileName\":\"image.jpeg\", \n    \"type\":\"image/jpeg\", \n    \"payload\":\"base64 payload\"\n  }\n}</code></pre>\n"
              tags:
                description: 'Create your own tags and use them to fetch, sort and report on your Virtual Numbers through our other endpoints. You can assign up to 10 tags per number.

                  '
                type: array
                maxItems: 10
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
  securitySchemes:
    bearer_auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://products.api.telstra.com/v2/oauth/token
          scopes:
            free-trial-numbers:read: read information for free trial numbers
            free-trial-numbers:write: write information for free trial numbers
            messages:read: read information for messages
            messages:write: write information for messages
            reports:read: read information for reports
            reports:write: write information for reports
            virtual-numbers:read: read information for virtual-numbers
            virtual-numbers:write: write information for virtual numbers
