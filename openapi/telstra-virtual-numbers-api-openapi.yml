  /virtual-numbers/{virtual-number}/optouts:
    get:
      security:
      - bearer_auth: []
      tags:
      - virtual numbers
      summary: Get recipient optouts list
      description: 'Use this endpoint to fetch any mobile number(s) that have opted out of receiving messages from a Virtual Number assigned to your account.


        Recipients can opt out at any time by sending an SMS with one of the industry standard keywords (case sensitive) such as STOP, STOPALL, UNSUBSCRIBE, QUIT, END, CANCEL and OPTOUT.


        Recipients can opt in at any time by sending an SMS with one of the industry standard keywords (case sensitive) such as START, STARTALL, OPTIN, UNSTOP, SUBSCRIBE and RESUBSCRIBE.'
      operationId: getRecipientOptouts
      parameters:
      - $ref: '#/components/parameters/TelstraAPIVersion'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/AcceptCharset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/virtual-number'
      responses:
        '200':
          description: Successful Response
          headers:
            Content-Language:
              schema:
                type: string
                example: en-au
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipientOptouts:
                    type: array
                    minItems: 0
                    maxItems: 50
                    description: 'The paginated results of your request. To fetch the next set of results, send another request and provide the succeeding offset value.

                      '
                    items:
                      $ref: '#/components/schemas/Recipient-optout'
                  paging:
                    $ref: '#/components/schemas/Paging'
        '400':
          description: 'Bad Request


            | code | suggested_action |

            | :--- | :--- |

            | VIRTUAL_NUM_INVALID | Check the number is a valid Virtual Number. |

            | VIRTUAL_NUM_UNASSIGNED | Check the number is assigned to your account. |

            | FIELD_INVALID | Ensure the number is a 10-digit Australian mobile number in national format (e.g. 0412345678). |

            | FIELD_LENGTH_ERR | Ensure the number is 10 digits only (e.g. 0412345678). |

            | FIELD_MISSING | Please supply the number. |

            '
          headers:
            Content-Language:
              schema:
                type: string
                example: en-au
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: 'Unauthorized


            | code | suggested_action |

            | :--- | :--- |

            | TOKEN_INVALID | Check the access token. |

            | TOKEN_EXPIRED | Please refresh the token. |

            '
          headers:
            Content-Language:
              schema:
                type: string
