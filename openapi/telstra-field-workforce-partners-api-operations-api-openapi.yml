  /task-list:
    get:
      tags:
      - Field Workforce Partners API Operations
      summary: Task List - Retrieve
      security:
      - bearerAuth: []
      description: This API operation will support the retrieval of a summary task listing with selected query criteria supported based on the data within the WFM Partner Gateway system. It will support the partner to be able to retrieve a list of tasks assigned to them which may require action for example all tasks in NEW status which are pending acceptance/rejection. Once the taskID is obtained the detailed information of that task can be retrieved using the "Task - Retrieve" API operation below.
      operationId: TaskList-Retrieve
      parameters:
      - name: Authorization
        in: header
        description: A header in the format 'Bearer {access_token}'
        required: true
        schema:
          type: string
      - name: partnerID
        in: header
        description: The Telstra WFM partner ID under which the tasks should be retrieved.
        required: true
        schema:
          type: string
          maxLength: 50
      - name: status
        in: query
        description: A filter to return only the tasks under the partner in the given status.
        required: false
        schema:
          type: string
          enum:
          - NEW
          - ACCEPTED
          - REJECTED
          - WITHDRAWN
          - COMPLETE
      - name: host
        in: query
        description: A filter to return only the tasks under a certain Telstra host system.
        required: false
        schema:
          type: string
          maxLength: 250
      - name: overdue
        in: query
        description: The response will return tasks which may be overdue for some action by the partner based on the criteria.
        required: false
        schema:
          type: boolean
          enum:
          - true
      - name: category
        in: query
        description: A filter to return only the tasks which have the given category.
        required: false
        schema:
          type: string
          enum:
          - ASSURANCE - COMMITMENT
          - ASSURANCE - APPOINTMENT
          - ACTIVATION - APPOINTMENT
          - ACTIVATION - COMMITMENT
