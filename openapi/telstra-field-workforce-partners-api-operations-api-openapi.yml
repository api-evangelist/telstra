      - clearanceActionCode
      - locationCode
      - partOfPlantCode
      - componentCode
      properties:
        clearanceActionCode:
          type: string
          maxLength: 255
          minLength: 1
          description: A code which indicates the action taken to clear the fault condition. Valid values depend on the location and part of plant codes selected.
        locationCode:
          type: string
          maxLength: 255
          minLength: 1
          description: A code which indicates the location of the fault condition.
        partOfPlantCode:
          type: string
          maxLength: 255
          minLength: 1
          description: A code which indicates the part of plant which had the fault condition. Valid values depend on the location code selected.
        componentCode:
          type: string
          maxLength: 255
          minLength: 1
          description: A code which indicates the component related to the fault condition. Valid values depend on the location and part of plant codes selected.
        causeCode:
          type: string
          maxLength: 255
          minLength: 1
          description: A code which indicates the root cause of the fault condition. Valid values depend on the location, part of plant and action codes selected.
