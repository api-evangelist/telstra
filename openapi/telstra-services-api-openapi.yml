openapi: 3.2.0
info:
  title: Telstra Services API
  version: '1.0'
  description: 'Operations tagged Services across 2 of this provider''s published API definitions: telstra-bandwidth-and-plan-modification-api-openapi.json, telstra-iot-connectivity-service-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://prod.okapi.ogw.evolve.okapi.telstra.com/connectivity/v0
  description: Telstra Products API (Production)
tags:
- name: Services
  description: Retrieve services
paths:
  /services:
    get:
      operationId: listCustomerServices
      tags:
      - Services
      summary: List services for a customer (by CIDN)
      description: Retrieves a paginated list of services belonging to the specified customer (CIDN). Supports filtering by `type`, `status`, and `name`. Returns total record count, applied filters, and supports pagination. Handles empty results, invalid filters, and rate limiting per Telstra standards.
      security:
      - OAuth2ClientCredentials:
        - fixed-connectivity:modify-bandwidth:modify
      parameters:
      - name: Authorization
        in: header
        required: true
        description: OAuth2 token for authentication.
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: IYpGOTXFWA1hG7MoBkZnmDmvY7ZQ
      - name: X-Correlation-Id
        in: header
        required: true
        description: Unique Correlation Id for each transaction to be used by all consumers.
        schema:
          type: string
          minLength: 36
          maxLength: 36
        example: f7c94213-36df-44cc-935f-025bb52cad42
      - name: Content-Type
        in: header
        required: true
        description: Accepting with application/json.
        schema:
          type: string
          enum:
          - application/json
        example: application/json
      - name: Accept
        in: header
        required: true
        description: Accept type of response (application/json).
        schema:
          type: string
          enum:
          - application/json
        example: application/json
      - name: type
        in: query
        required: false
        description: Filter by service type (case-insensitive exact match).
        schema:
          type: string
          minLength: 1
          maxLength: 64
        examples:
          tidAdapt:
            value: tid-adapt
          adaptiveFibre:
            value: adaptive-fibre
      - name: status
        in: query
        required: false
        description: Filter by service status.
        schema:
          type: string
          enum:
          - active
          - in-progress
          - failed
          - rejected
          - completed
          minLength: 1
          maxLength: 32
        example: active
      - name: name
        in: query
        required: false
        description: Filter by service name (case-insensitive contains).
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: Ultra
      - name: page
        in: query
        required: false
        description: 1-based page index.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 2
      - name: limit
        in: query
        required: false
        description: Page size (max 200).
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        example: 25
      - name: Telstra-api-version
        in: header
        required: false
        description: B2B2X Header-based API version. Specify the published API minor version (e.g., 1.2).
        schema:
          type: string
          minLength: 1
          maxLength: 16
        example: '1.2'
      - name: Accept-Charset
        in: header
        required: true
        description: Specifies the character sets that are acceptable for response. Default is UTF-8 if not specified.
        schema:
          type: string
          enum:
          - UTF-8
          - ISO-8859-1
          - US-ASCII
          minLength: 5
          maxLength: 10
        example: UTF-8
      - name: Content-Language
        in: header
        required: true
        description: Language of the request content (e.g., en, en-US).
        schema:
          type: string
          minLength: 2
          maxLength: 8
        example: en-AU
      - name: variant
        in: query
        required: false
        description: Filter by service variant (case-insensitive exact match).
        schema:
          type: string
          minLength: 1
          maxLength: 200
        examples:
          lite:
            value: Telstra Internet Direct Lite Adapt
          premium:
            value: Telstra Internet Direct Premium Adapt
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Total number of records matching the filter (across all pages).
              schema:
                type: integer
                example: 120
            Content-Language:
              description: The language used in the response content (e.g., en, en-US).
              schema:
                type: string
                example: en-US
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesPage'
              examples:
                success:
                  summary: Paginated success
                  value:
                    page: 2
                    limit: 25
                    totalRecords: 120
                    filters:
                      status: active
                      type: tid-adapt
                      variant: Telstra Internet Direct Premium Adapt
                    data:
                      services:
                      - id: AAZZ000000123457
                        attributes:
                          name: Internet
                          type: tid-adapt
                          status: active
                          variant: Telstra Internet Direct Premium Adapt
                          bandwidth: 800Mbps
                emptyResult:
                  summary: No matching records
                  value:
                    page: 1
                    limit: 25
                    totalRecords: 0
                    filters:
                      status: active
                      name: abc
                      variant: Telstra Internet Direct Lite Adapt
                    data:
                      services: []
                emptyResultWithInfo:
                  summary: No matching records (informational error included under 200)
                  value:
                    page: 1
                    limit: 25
                    totalRecords: 0
                    filters:
                      status: active
                      name: abc
                      variant: Telstra Internet Direct Lite Adapt
                    data:
                      services: []
                    errors:
                    - code: NO_MATCHING_RECORDS
                      issue: No services found matching the provided filters.
                      suggested_action: Verify filter values or remove one or more filters to broaden the search.
                      field: status,name,variant
                      value: active,abc,Telstra Internet Direct Lite Adapt
                      location: query
                      link: https://api.example.com/docs/errors#NO_MATCHING_RECORDS
        '400':
          description: Bad Request — invalid filters or pagination parameters.
          headers:
            Content-Language:
              description: The language used in the response content (e.g., en, en-US).
              schema:
                type: string
                example: en-US
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                invalidFilter:
                  summary: Invalid filter value
                  value:
                    errors:
                    - code: FIELD_INVALID
                      issue: The type is invalid.
                      suggested_action: Check the type. It should be one of [tid-adapt, adaptive-fibre].
                      field: type
                      value: abc
                      location: query
                      link: https://api.example.com/docs/errors#FIELD_INVALID
                invalidFilterVariant:
                  summary: Invalid variant filter value
                  value:
                    errors:
                    - code: FIELD_INVALID
                      issue: The variant is invalid.
                      suggested_action: Check the variant. It should be one of [Telstra Internet Direct Lite Adapt, Telstra Internet Direct Premium Adapt].
                      field: variant
                      value: wrong-variant
                      location: query
                      link: https://api.example.com/docs/errors#FIELD_INVALID
                invalidPagination:
                  summary: Invalid pagination parameter
                  value:
                    errors:
                    - code: FIELD_INVALID
                      issue: The size is invalid
                      suggested_action: Check the size. It should be between 1 and 200.
                      field: limit
                      value: '500'
                      location: query
                      link: https://api.example.com/docs/errors#FIELD_INVALID
                missingRequired:
                  summary: Missing required parameter
                  value:
                    errors:
                    - code: FIELD_MISSING
                      issue: The 'cidn' is missing.
                      suggested_action: Please provide all required fields.
                      field: cidn
                      value: ''
                      location: query
                      link: https://api.example.com/docs/errors#FIELD_MISSING
        '401':
          description: Unauthorized — missing or invalid token.
          headers:
            Content-Language:
              description: The language used in the response content (e.g., en, en-US).
              schema:
                type: string
                example: en-US
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                unauthorized:
                  summary: Missing or invalid authentication token
                  value:
                    errors:
                    - code: INVALID_TOKEN
                      issue: The Authentication Token is Missing or Invalid.
                      suggested_action: Check the Authentication Token. It should be the same you received in the Generate Authentication Token response.
                      field: Authorization
                      value: ''
                      location: header
                      link: https://api.example.com/docs/errors#INVALID_TOKEN
        '403':
          description: Forbidden — caller not permitted to view this customer’s services.
          headers:
            Content-Language:
              description: The language used in the response content (e.g., en, en-US).
              schema:
                type: string
                example: en-US
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                forbidden:
                  summary: Caller not permitted
                  value:
                    errors:
                    - code: RESOURCE_AUTH_ERR
                      issue: You don't have permission to access this resource.
                      suggested_action: Check the permissions associated with your account.
                      location: decision
                      link: https://api.example.com/docs/errors#RESOURCE_AUTH_ERR
        '404':
          description: Not Found — no service for given cidn
          headers:
            Content-Language:
              description: Language of the response content.
              schema:
                type: string
                example: en-AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                notFound:
                  summary: Not found
                  value:
                    errors:
                    - code: NOT_FOUND
                      issue: No service found for the given cidn.
                      suggested_action: Verify serviceId and then retry.
                      location: body
                      link: https://api.example.com/docs/errors#NOT_FOUND
        '429':
          description: Too Many Requests — rate limit exceeded.
          headers:
            Retry-After:
              description: Seconds until the next allowed request.
              schema:
                type: integer
                example: 30
            Content-Language:
              description: The language used in the response content (e.g., en, en-US).
              schema:
                type: string
                example: en-US
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                rateLimit:
                  summary: Rate limit exceeded
                  value:
                    errors:
                    - code: TOO_MANY_REQUESTS
                      issue: The API rate limit has been reached.
                      suggested_action: Reduce the number of concurrent calls and try again.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.example.com/docs/errors#TOO_MANY_REQUESTS
        '500':
          description: Internal Server Error.
          headers:
            Content-Language:
              description: The language used in the response content (e.g., en, en-US).
              schema:
                type: string
                example: en-US
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                serverError:
                  summary: Unexpected server error
                  value:
                    errors:
                    - code: INTERNAL_SERVER_ERROR
                      issue: An unexpected error occurred.
                      suggested_action: Please try again later. If the issue persists, Contact Telstra support with your correlationId.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.example.com/docs/errors#INTERNAL_SERVER_ERROR
                technicalFailure:
                  summary: Non-recoverable technical error
                  value:
                    errors:
                    - code: TECHNICAL_FAILURE
                      issue: An unexpected error occurred.
                      suggested_action: Please try again later. If the issue persists, Contact Telstra support with your correlationId.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.example.com/docs/errors#TECHNICAL_FAILURE
        '503':
          description: Service Unavailable.
          headers:
            Retry-After:
              description: Seconds until the next allowed request.
              schema:
                type: integer
                example: 30
            Content-Language:
              description: The language used in the response content (e.g., en, en-US).
              schema:
                type: string
                example: en-US
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                serviceUnavailable:
                  summary: Service temporarily unavailable
                  value:
                    errors:
                    - code: SERVICE_UNAVAILABLE
                      issue: Service is temporarily unavailable due to maintenance or overload.
                      suggested_action: Retry after the specified period.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.example.com/docs/errors#SERVICE_UNAVAILABLE
    servers:
    - url: https://prod.okapi.ogw.evolve.okapi.telstra.com/connectivity/v0
      description: Telstra Products API (Production)
