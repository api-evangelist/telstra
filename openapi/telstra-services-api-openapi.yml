              schema:
                items:
                  $ref: '#/components/schemas/GetServiceSimsResponse'
                type: array
          description: The request was successfully processed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: 'Invalid Input Parameter Provided


            The request is missing Authorization parameters.

            Refer to the sample code for generate authentication token in the link for more details [https://dev.telstra.com/content/telstra-iot-connectivity-service-api#section/Authentication](https://dev.telstra.com/content/telstra-iot-connectivity-service-api#section/Authentication)

            '
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
          description: 'User has not provided access credentials


            TECH-ERR - Either the token has expired or incorrect token was used. <br/><br/>

            OR <br/><br/>

            TECH-ERR - Technical error : Invalid API call as no apiproduct match found. Credit card billing method is not supported. Update billing method to Telstra Account from update billing method page. If you don''t have a Telstra Account ending with 0 but ABN is available then you can request for a Telstra Account by filling the details in this link https://dev.telstra.com/content/requesting-telstra-billing-account

            If problem persists, write a post in ICM Service API forum page [https://dev.telstra.com/telstradev-forum/icm-service-api-forum](https://dev.telstra.com/telstradev-forum/icm-service-api-forum) for the TelstraDev admin to check the issue.

            Refer to the sample code for **generate authentication token** in the link for more details [https://dev.telstra.com/content/telstra-iot-connectivity-service-api#section/Authentication](https://dev.telstra.com/content/telstra-iot-connectivity-service-api#section/Authentication)

            '
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: 'User lacks roles to access this resource


            Authorization credentials passed and accepted but account does not have permission <br/><br/>

            OR <br/><br/>

            SpikeArrest-The API call rate limit has been exceeded.

            You will receive a SpikeArrest error in two possible situations:

            A: You have exceeded your free trial quota. If you would like to continue using the ICM Service API, please upgrade to a paid plan by creating a company with Telstra Billing details (not, credit card is no longer accepted for this API product).

            B: Concurrent API Calls are higher than supported, reduce the concurrent calls and try again. If problem persists, contact us at [telstradev@team.telstra.com](telstradev@team.telstra.com).

            '
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: "Requested resource not found\n\nThe URL is incorrect. Correct the URL and try again.\n\nFor Free Trial:\nA Free Trial MSISDN may have been previously provisioned. Free Trial developers can be provisioned with only 1 Free Trial MSISDN.\nUse only the default App \"Free Trial APIs\". If a new app was created, it will throw this error.\nFor paid version:\nIf you are a customer with Telstra account (not credit card), use the keys available under https://dev.telstra.com/user/me/apps under the App name \"Production Keys\".\nExecute `GET all services` call to ensure you get successful response. \n\nIf valid response is not found, Please raise an issue with ICM Support [ICMSupport@team.telstra.com](ICMSupport@team.telstra.com) along with request details and error details.\n"
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: 'Internal Server Error


            Technical error: A server error has occurred while processing your request or the endpoints provided does not exist in the API.


            If the error persists even after re-try, check our https://dev.telstra.com/api/status page to ensure the service is up and running. If the service is not up and running check our forum page [https://dev.telstra.com/telstradev-forum/icm-service-api-forum](https://dev.telstra.com/telstradev-forum/icm-service-api-forum) and leave a post to confirm the outage for the Telstradev admin to check the issue.

            '
