                        end: '2099-12-31'
                      billDescription: Adaptive Fibre modem purchase
                      attributes:
                        device: TELSTRA SMART MODEM 4
                noRecordsFound:
                  summary: No records found
                  value:
                    paging:
                      totalRecords: 0
                      offset: 0
                      limit: 25
                      nextPage: null
                      previousPage: null
                      lastPage: null
                    data: []
                    errors:
                    - code: NO_MATCHING_RECORDS
                      issue: No pricing found matching the provided filters.
                      suggested_action: Verify filter values or remove one or more filters to broaden the search.
                      field: product,bandwidth
                      value: tid-adapt,100mbps
                      location: query
                      link: https://api.example.com/docs/errors#NO_MATCHING_RECORDS
        '400':
          description: Bad Request — invalid filters or parameter combination.
          headers:
            Content-Language:
              description: The language used in the response content (e.g., en, en‑AU).
              schema:
                type: string
                example: en‑AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                attributesWithoutProduct:
                  summary: attributes supplied without product
                  value:
                    errors:
                    - code: FIELD_INVALID
                      issue: The 'attributes' filter can only be used when 'product' is provided.
                      suggested_action: Provide 'product' when using attributes[...] or remove attributes.
                      field: attributes[bandwidth]
                      value: 50 Mbps
                      location: query
                      link: https://api.telstra.com/docs/errors#FIELD_INVALID
                invalidAttributeForProduct:
                  summary: Attribute not valid for selected product
                  value:
                    errors:
                    - code: FIELD_INVALID
                      issue: The attribute 'plan' is not valid for product 'tid-adapt'.
                      suggested_action: Remove or correct the attribute for the selected product.
                      field: attributes[plan]
                      value: 50/20 Mbps
                      location: query
                      link: https://api.telstra.com/docs/errors#FIELD_INVALID
        '401':
          description: Unauthorized — missing/invalid token.
          headers:
            Content-Language:
              schema:
                type: string
                example: en‑AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                unauthorized:
                  summary: Missing or invalid authentication token
                  value:
                    errors:
                    - code: INVALID_TOKEN
                      issue: The Authentication Token is Missing or Invalid.
                      suggested_action: Check the Authentication Token. It should be valid and unexpired.
                      field: Authorization
                      value: ''
                      location: header
                      link: https://api.telstra.com/docs/errors#INVALID_TOKEN
        '403':
          description: Forbidden — caller not permitted to read prices.
          headers:
            Content-Language:
              schema:
                type: string
                example: en‑AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                forbidden:
                  summary: Caller not permitted
                  value:
                    errors:
                    - code: RESOURCE_AUTH_ERR
                      issue: You don't have permission to access this resource.
                      suggested_action: Check the permissions and required scopes associated with your account.
                      field: product
                      value: adaptive-fibre
                      location: path
                      link: https://api.telstra.com/docs/errors#RESOURCE_AUTH_ERR
        '429':
          description: Too Many Requests — rate limit exceeded.
          headers:
            Retry-After:
              description: Seconds until the next allowed request.
              schema:
                type: integer
                example: 30
            Content-Language:
              schema:
                type: string
                example: en‑AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                rateLimit:
                  summary: Rate limit exceeded
                  value:
                    errors:
                    - code: TOO_MANY_REQUESTS
                      issue: The API rate limit has been reached.
                      suggested_action: Reduce the number of concurrent calls and try again.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.telstra.com/docs/errors#TOO_MANY_REQUESTS
        '500':
          description: Internal Server Error — unexpected server‑side error.
          headers:
            Content-Language:
              schema:
                type: string
                example: en‑AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                serverError:
                  summary: Unexpected server error
                  value:
                    errors:
                    - code: INTERNAL_SERVER_ERROR
                      issue: An unexpected error occurred.
                      suggested_action: Please try again later. If the issue persists, contact support with your correlationId.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.telstra.com/docs/errors#INTERNAL_SERVER_ERROR
        '503':
          description: Service Unavailable — temporary maintenance or overload.
          headers:
            Retry-After:
              description: Seconds until the client may retry.
              schema:
                type: integer
                minimum: 1
            Content-Language:
              schema:
                type: string
                example: en‑AU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                serviceUnavailable:
                  summary: Service temporarily unavailable
                  value:
                    errors:
                    - code: SERVICE_UNAVAILABLE
                      issue: Service is temporarily unavailable due to maintenance or overload.
                      suggested_action: Retry after the specified period.
                      field: ''
                      value: ''
                      location: server
                      link: https://api.telstra.com/docs/errors#SERVICE_UNAVAILABLE
components:
  schemas:
    ListPriceResponse:
      type: object
      required:
      - paging
      - data
      properties:
        paging:
          type: object
          required:
          - totalRecords
          - offset
          - limit
          - nextPage
          - previousPage
          - lastPage
          properties:
            totalRecords:
              type: integer
              description: Total number of price records matching the request.
              minimum: 0
              maximum: 1000000
            offset:
              type: integer
              description: Zero-based index of the first record returned.
              minimum: 0
              maximum: 1000000
            limit:
              type: integer
              description: Maximum number of records returned in this response.
              minimum: 1
              maximum: 500
            nextPage:
              type:
              - string
              - 'null'
              format: uri
              description: URL to the next page of results, or null if at end.
              minLength: 1
              maxLength: 2048
            previousPage:
              type:
              - string
              - 'null'
              format: uri
              description: URL to the previous page of results, or null if at start.
              minLength: 1
              maxLength: 2048
            lastPage:
              type:
              - string
              - 'null'
              format: uri
              description: URL to the last page of results, or null if only one page.
              minLength: 1
              maxLength: 2048
        data:
          type: array
          minItems: 0
          maxItems: 500
          items:
            $ref: '#/components/schemas/ListPrice'
    Errors:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          minItems: 0
          maxItems: 10
    ChargeType:
      type: string
      description: Type of charge for a list price.
      enum:
      - RECURRING
      - ONE_OFF
      minLength: 1
      maxLength: 32
    ListPrice:
      type: object
      description: 'A list price record. Includes product identifier and product-specific attributes. Note: This is list pricing only (no customer-specific pricing fields).

        '
      required:
      - product
      - chargeType
      - name
      - unit
      - price
      - validFor
      - attributes
      properties:
        product:
          type: string
          minLength: 1
          maxLength: 100
        chargeType:
          $ref: '#/components/schemas/ChargeType'
        name:
          type: string
          minLength: 1
          maxLength: 128
        unit:
          type: string
          pattern: ^[A-Z]{3}$
          minLength: 1
          maxLength: 3
        price:
          type: number
          format: double
        validFor:
          type: object
          required:
          - start
          - end
          properties:
            start:
              type: string
              format: date
              description: Start date for which the price is valid (YYYY-MM-DD).
              minLength: 1
              maxLength: 10
            end:
              type: string
              format: date
              description: End date for which the price is valid (YYYY-MM-DD).
              minLength: 1
              maxLength: 10
        billDescription:
          type: string
          minLength: 1
          maxLength: 256
        attributes:
          type: object
          additionalProperties: true
    Error:
      type: object
      required:
      - code
      - issue
      - suggested_action
      - field
      - value
      - location
      - link
      properties:
        code:
          type: string
          description: Machine-readable error code.
          minLength: 1
          maxLength: 32
        issue:
          type: string
          description: Human-readable explanation of the error.
          minLength: 1
          maxLength: 256
          example: Requested newBandwidth exceeds supported Adaptive Fibre capacity
        suggested_action:
          type: string
          description: Recommended corrective action.
          minLength: 1
          maxLength: 256
          example: Due to physical change required, proceed to Adaptive Network Centre to raise request
        field:
          type: string
          description: Name of the field causing the error (if applicable).
          minLength: 0
          maxLength: 64
          example: type
        value:
          type: string
          description: The invalid value provided (if applicable).
          minLength: 0
          maxLength: 128
          example: abc
        location:
          type: string
          description: Where the error occurred.
          enum:
          - query
          - header
          - path
          - body
