components:
  parameters:
    ContentLanguage:
      name: Content-Language
      in: header
      required: true
      schema:
        type: string
        example: en-au
    offset:
      name: offset
      description: 'Use the offset to navigate between the response results. An offset of 0 will display the first page of results, and so on.

        '
      in: query
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
        maximum: 999999
    AcceptCharset:
      name: Accept-Charset
      in: header
      required: true
      schema:
        type: string
        example: utf-8
    ContentType:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        example: application/json
    TelstraAPIVersion:
      name: Telstra-api-version
      in: header
      required: false
      schema:
        type: string
        example: 3.1.0
    reportIdGet:
      name: reportId
      in: path
      description: 'Use the reportId returned in the POST /reports/{reportType} response.

        '
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
    limit:
      name: limit
      in: query
      description: 'Tell us how many results you want us to return, up to a maximum of 50.

        '
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1
        maximum: 50
    Accept:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        example: application/json
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        example: Bearer <access_token>
  requestBodies:
    reportsMessagesPost:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - startDate
            - endDate
            properties:
              startDate:
                description: 'Set the time period you want to generate a report for by typing the start date (inclusive) here.


                  Note that we only retain data for three months, so please ensure your startDate is not more than three months old.


                  Use ISO format(yyyy-mm-dd), e.g. 2019-08-24.

                  '
                type: string
                format: date
                minLength: 10
                maxLength: 10
              endDate:
                description: 'Type the end date (inclusive) of your reporting period here.


                  Your endDate must be a date in the past, and less than three months from your startDate. Use ISO format(yyyy-mm-dd).

                  '
                type: string
                format: date
                minLength: 10
                maxLength: 10
              reportCallbackUrl:
                description: "Tell us the callbackUrl you want us to notify when your report is ready for download.\n\nSample callback response:\n\n<pre><code class=\"language-sh\">{\n  \"reportId\":\"1520b774-46b0-4415-a05f-7bcb1c032c59\",\n  \"reportStatus\":\"completed\",\n  \"timestamp\":\"2022-11-10T05:06:42.823Z\"\n}</code></pre>\n"
                type: string
              filter:
                description: "Filter your messages report by:\n  * tag - use one of the tags assigned to your message(s)\n  * number - either the Virtual Number used to send the message, or the Recipient Number the message was sent to.\n"
                type: string
            example:
              startDate: '2022-08-24'
              endDate: '2022-09-25'
              reportCallbackUrl: https://www.example.com
              filter: tag1
  schemas:
    Errors:
      type: object
      properties:
        errors:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Error'
    ReportGet:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: 'The UUID assigned to your report.

            '
        reportStatus:
          type: string
          description: "The status of the report. It will be either: \n      * **queued** - the report is in the queue for generation. \n      * **completed** - the report is ready for download. \n      * **failed** - the report failed to generate. Please try again.\n"
        reportUrl:
          type: string
          description: Use this link to download your CSV file.
      example:
        reportId: 6940c774-4335-4d2b-b758-4ecb19412e85
        reportStatus: completed
        reportUrl: https://www.example.com
    ReportsGet:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: 'Use this UUID to fetch your report with the GET /reports/{reportId} endpoint.

            '
        reportStatus:
          type: string
          description: "The status of the report. It will be either: \n      * **queued** - the report is in the queue for generation. \n      * **completed** - the report is ready for download. \n      * **failed** - the report failed to generate. Please try again.\n"
        reportType:
          type: string
          description: The type of report generated.
        reportExpiry:
          type: string
          format: date
          description: 'The expiry date of your report. After this date, you will be unable to download your report.

            '
      example:
        reportId: 6940c774-4335-4d2b-b758-4ecb19412e85
        reportStatus: completed
        reportType: messages
        reportExpiry: '2023-01-01'
    Reports-MessagesPost:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: 'When your report is ready for download, you can use this UUID to fetch it with the GET /reports/{reportId} endpoint.

            '
        reportCallbackUrl:
          type: string
          description: If you provided a reportCallbackUrl in your request, it will be returned here.
        reportStatus:
          type: string
          description: "The status of the report. It will be either: \n      * **queued** - the report is in the queue for generation. \n      * **completed** - the report is ready for download. \n      * **failed** - the report failed to generate. Please try again.\n"
      example:
        reportId: 6940c774-4335-4d2b-b758-4ecb19412e85
        reportCallbackUrl: https://www.example.com
        reportStatus: queued
    Error:
      type: object
      required:
      - code
      - issue
      - suggested_action
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique code of the error
        issue:
          type: string
          minLength: 1
          maxLength: 99999
          description: The reason for the error
        suggested_action:
          type: string
          minLength: 1
          maxLength: 99999
          description: Suggest practical actions for this particular issue.
        field:
          type: string
          minLength: 1
          maxLength: 99999
          description: The field that caused the error
        value:
          type: string
          minLength: 1
          maxLength: 99999
          description: The value of the field that caused the error
        location:
          type: string
          description: The location of the field that caused the error.
          enum:
          - body
          - path
          - query
        link:
          type: string
          minLength: 1
          maxLength: 99999
          description: URI for detailed information related to this error for the developer.
  securitySchemes:
    bearer_auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://products.api.telstra.com/v2/oauth/token
          scopes:
            free-trial-numbers:read: read information for free trial numbers
            free-trial-numbers:write: write information for free trial numbers
            messages:read: read information for messages
            messages:write: write information for messages
            reports:read: read information for reports
            reports:write: write information for reports
            virtual-numbers:read: read information for virtual-numbers
            virtual-numbers:write: write information for virtual numbers
