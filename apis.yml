description: Telstra is Australia's largest telecommunications and mobile network operator, providing fixed broadband, mobile voice and data,
  enterprise networking, and IoT connectivity across Australia and into Asia. Telstra exposes a developer programme at dev.telstra.com fronting
  carrier-grade Messaging (SMS / MMS) and Mobile Number Verification APIs, with official SDKs in Python, Node.js, Java, .NET, and Go, and Arduino
  libraries for the Telstra Cat-1 and Cat-M1 IoT development kits. The dev.telstra.com catalogue also lists SIM Swap, Device Swap, KYC Match,
  KYC Tenure, Mobile Push Notifications, Bandwidth and Plan Modification, IoT Connectivity Service and Telstra Cloud Sight APIs, with a public
  API status page. APIs are reached at tapi.telstra.com behind OAuth 2.0 client credentials with the NSMS or MNV scopes.

